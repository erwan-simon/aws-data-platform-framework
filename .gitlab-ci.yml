variables:
  PROJECT_NAME: poc
  STAGE_NAME: $CI_COMMIT_REF_SLUG
  PYTHON_CODE_PATH: "./"
  PYENV_VERSION: 3.13
  TARGET_REPO_NAME: "aws-data-platform-framework"


include:
  - project: 'erwan.simon/devops-platform-ci-templates'
    ref: 'v2.1.0'
    file:
      - 'base.yml'
      - 'docker.yml'
      - 'python.yml'
      - 'mirror_to_github.yml'

stages:
  - init
  - format
  - security
  - unit_tests
  - integration_tests
  - mirror_to_github

#############################################################
######################## INTEGRATION-TESTS ##################
#############################################################
# Two parallel jobs deploy and exercise different pipeline shapes against the live AWS account:
#   - `integration_tests_full_fixture` deploys the in-tree `integration_tests/` project
#     (5 tasks, native + Spark, SQL entrypoint, upsert, table maintenance, cleanup) — broad
#     coverage of platform features.
#   - `integration_tests_scaffold` runs the cookiecutter template through `generate_scaffold.sh`
#     and deploys the resulting minimal 2-task pipeline — verifies what a new user actually starts with.

.integration_tests_base:
  stage: integration_tests
  allow_failure: false
  variables:
    PYTHONUNBUFFERED: "1"
  before_script:
    - mkdir -p ~/.aws
    - echo "${CI_JOB_JWT_V2}" > /tmp/web_identity_token
    - echo -e "[profile default]\nrole_arn=${GITLAB_ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" > ~/.aws/config
    - pip install boto3
  needs:
    - init_ecr_token
  except:
    refs:
      - tags

integration_tests_full_fixture:
  extends: .integration_tests_base
  script:
    - bash scripts/run_integration_tests.sh integration_tests/iac datalake_test tests

integration_tests_scaffold:
  extends: .integration_tests_base
  variables:
    # Mise pulls some python builds whose GitHub artifact attestations aren't published.
    MISE_PYTHON_GITHUB_ATTESTATIONS: "false"
  before_script:
    - !reference [.integration_tests_base, before_script]
    # Install mise so we can exercise the rendered scaffold through its own mise tasks.
    - curl https://mise.run | sh
    - export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
    - mise trust
  script:
    - pip install cookiecutter
    - mise run integration-scaffold "$STAGE_NAME"
