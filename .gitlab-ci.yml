variables:
  PROJECT_NAME: poc
  STAGE_NAME: $CI_COMMIT_REF_SLUG
  PYTHON_CODE_PATH: "./"
  PYENV_VERSION: 3.13
  TARGET_REPO_NAME: "aws-data-platform-framework"


include:
  - project: 'erwan.simon/devops-platform-ci-templates'
    ref: 'v2.3.3'
    file:
      - 'base.yml'
      - 'docker.yml'
      - 'python.yml'
      - 'mirror_to_github.yml'

stages:
  - init
  - format
  - security
  - unit_tests
  - integration_tests
  - mirror_to_github

#############################################################
######################## SECURITY ###########################
#############################################################
# Custom security scan: trivy IaC misconfig scan on Terraform files.
# Fails the pipeline on HIGH/CRITICAL findings. Accepted-finding IDs are
# listed (with justification) in `.trivyignore` at the repo root.
trivy_iac:
  stage: security
  image: ubuntu:24.04
  variables:
    # Don't let `mise run trivy` auto-install other tools declared in mise.toml
    # (poetry, snyk, pre-commit…). The slim runner image only has the aqua
    # backend trivy needs, and the before_script installs trivy explicitly.
    MISE_AUTO_INSTALL: "false"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
    - curl https://mise.run | sh
    - export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
    - mise trust
    - mise install trivy
  script:
    - export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
    - mise run trivy --strict
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

#############################################################
######################## INTEGRATION-TESTS ##################
#############################################################
# Two parallel jobs deploy and exercise different pipeline shapes against the live AWS account:
#   - `integration_tests_full_fixture` deploys the in-tree `integration_tests/` project
#     (5 tasks, native + Spark, SQL entrypoint, upsert, table maintenance, cleanup) — broad
#     coverage of platform features.
#   - `integration_tests_scaffold` runs the cookiecutter template through `generate_scaffold.sh`
#     and deploys the resulting minimal 2-task pipeline — verifies what a new user actually starts with.

.integration_tests_base:
  stage: integration_tests
  allow_failure: false
  # Serialize per-branch across pipelines (each job is its own group so
  # full_fixture and scaffold still run in parallel within one pipeline).
  resource_group: ${CI_COMMIT_REF_SLUG}_${CI_JOB_NAME}
  variables:
    PYTHONUNBUFFERED: "1"
    # Mise pulls some python builds whose GitHub artifact attestations aren't published.
    MISE_PYTHON_GITHUB_ATTESTATIONS: "false"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates awscli jq
    - mkdir -p ~/.aws
    - echo "${CI_JOB_JWT_V2}" > /tmp/web_identity_token
    - echo -e "[profile default]\nrole_arn=${GITLAB_ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" > ~/.aws/config
    # Authenticate mise's GitHub calls so we don't hit the 60-req/h anonymous limit.
    # Same secret + convention as devops-platform-ci-templates base.yml.
    - export GITHUB_TOKEN=$(aws secretsmanager get-secret-value --secret-id "${GITHUB_TOKEN_SECRET_NAME}" --output text --query SecretString | jq -r .token)
    # Install mise so the pinned toolchain (terraform/python/poetry/awscli) is used,
    # not whatever ships in the runner image.
    - curl https://mise.run | sh
    - export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
    - mise trust
    - mise install
    # pip-install AFTER mise so boto3 lands in the mise-managed python used by the test scripts.
    - pip install boto3
  needs:
    - init_ecr_token
    - ruff
    - hadolint
    - secret_scan
    - trivy_iac
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # Skip integration tests for docs-only commits (conventional commit `docs:` / `doc(scope):`).
    - if: $CI_COMMIT_TITLE =~ /^docs?(\([^)]*\))?!?:/
      when: never
    - when: on_success

integration_tests_full_fixture:
  extends: .integration_tests_base
  script:
    - mise run integration-full

integration_tests_scaffold:
  extends: .integration_tests_base
  script:
    - pip install cookiecutter
    - mise run integration-scaffold "$STAGE_NAME"

# Smoke-tests the failsafe_shutdown lambda on the env deployed by
# integration_tests_full_fixture (the lambda is domain-scoped, so the
# full-fixture env exposes it). Catches regressions where the lambda crashes
# at init (e.g. broken packaging) — which would silently leave task failures
# undetected in production, as observed on dev1 in May 2026.
failsafe_lambda_smoke_test:
  extends: .integration_tests_base
  needs:
    - init_ecr_token
    - ruff
    - hadolint
    - secret_scan
    - trivy_iac
    - integration_tests_full_fixture
  script:
    - bash scripts/failsafe_lambda_smoke_test.sh "$PROJECT_NAME" datalake_test "$STAGE_NAME"
