# Tool versions for deploying the {{cookiecutter.domain_name}} domain.
#
# Install all of them with: `mise install` (https://mise.jdx.dev/).
#
# Docker is not managed here — install Docker Desktop / OrbStack / colima separately,
# the daemon is needed at terraform apply time to build task images and push them to ECR.
#
# `poetry` is only needed because the scaffold ships an example private library
# (`code/shared_lib/`) built and published at apply time. Remove it from this file if
# you delete the shared_lib example (see README §"Shared Python libraries").

[tools]
terraform = "1.10.5"
awscli    = "2.22.0"
poetry    = "1.8.4"

# `mise run plan|deploy <workspace>` runs init, selects/creates the workspace, and then
# plan or apply — with the pinned terraform version, regardless of whether mise's shell
# hook is active.

[tasks.plan]
description = "terraform init + workspace select/new + plan. Usage: mise run plan <workspace>"
dir = "iac"
run = [
  "terraform init{% if cookiecutter.terraform_backend_bucket_name %} -backend-config=backend.hcl{% endif %}",
  "terraform workspace select {% raw %}{{arg(name='ws')}}{% endraw %} 2>/dev/null || terraform workspace new {% raw %}{{arg(name='ws')}}{% endraw %}",
  "terraform plan",
]

[tasks.deploy]
description = "terraform init + workspace select/new + apply. Usage: mise run deploy <workspace>"
dir = "iac"
run = [
  "terraform init{% if cookiecutter.terraform_backend_bucket_name %} -backend-config=backend.hcl{% endif %}",
  "terraform workspace select {% raw %}{{arg(name='ws')}}{% endraw %} 2>/dev/null || terraform workspace new {% raw %}{{arg(name='ws')}}{% endraw %}",
  "terraform apply --auto-approve",
]

[tasks.run-pipeline]
description = "Trigger a pipeline execution and wait for it to finish. Usage: mise run run-pipeline <stage> <pipeline>"
run = """
set -eu
arn="arn:aws:states:{{cookiecutter.aws_region}}:{{cookiecutter.aws_account_id}}:stateMachine:{{cookiecutter.project_name}}_{{cookiecutter.domain_name}}_{% raw %}{{arg(name='stage')}}_{{arg(name='pipeline')}}{% endraw %}"
exec_arn=$(aws stepfunctions start-execution --state-machine-arn "$arn" --input '{}' --query executionArn --output text)
echo "Triggered: $exec_arn"
echo "Console: https://{{cookiecutter.aws_region}}.console.aws.amazon.com/states/home?region={{cookiecutter.aws_region}}#/v2/executions/details/$exec_arn"
while :; do
  status=$(aws stepfunctions describe-execution --execution-arn "$exec_arn" --query status --output text)
  [ "$status" != "RUNNING" ] && break
  sleep 60
done
echo "Final status: $status"
[ "$status" = "SUCCEEDED" ] || exit 1
"""
