# Tool versions for working on the framework itself: developing the datalake_sdk,
# running unit tests, and deploying the integration_tests/ fixture.
#
# Install all of them with: `mise install` (https://mise.jdx.dev/).
#
# Docker is not managed here — install Docker Desktop / OrbStack / colima separately,
# the daemon is needed by `build_and_upload_image_to_ecr` at terraform apply time.

[settings]
python.compile = false

[tools]
terraform = "1.10.5"
python    = "3.11.11"
poetry    = "1.8.4"
awscli    = "2.22.0"
node      = "20.18.1"
tflint    = "0.55.1"
trivy     = "0.70.0"
hadolint  = "2.13.1"
gitleaks  = "8.21.2"
jq        = "1.7.1"
"npm:snyk"    = "1.1294.3"
ruff          = "0.15.4"
"pipx:pre-commit" = "4.0.1"

# `mise run <task>` to execute, `mise tasks` to list.

[tasks.sdk-install]
description = "Install datalake_sdk deps (use ARGS='-E agent' for the agent extra)"
dir = "datalake_sdk"
run = "poetry install $ARGS"

[tasks.sdk-build]
description = "Build the datalake_sdk wheel into datalake_sdk/dist/"
dir = "datalake_sdk"
run = "poetry build"

[tasks.integration-full]
description = "Deploy + run the in-tree integration_tests/ fixture (5 tasks). Usage: mise run integration-full [parallelism]"
usage = 'arg "parallelism" default="5" help="terraform apply -parallelism value"'
run = "bash scripts/run_integration_tests.sh integration_tests/iac datalake_test tests {{arg(name='parallelism')}}"

[tasks.integration-scaffold]
description = "Render the cookiecutter scaffold and exercise it through its own mise tasks. Usage: mise run integration-scaffold <stage> [parallelism]"
usage = '''
arg "stage"
arg "parallelism" default="5" help="terraform apply -parallelism value"
'''
run = """
set -eu
bash scripts/generate_scaffold.sh
cd _integration_test/datalake_scaffold
mise trust
mise install
mise run deploy "{{arg(name='stage')}}" "{{arg(name='parallelism')}}"
mise run run-pipeline "{{arg(name='stage')}}" main
"""

# ---------------------------------------------------------------------------
# CI tasks (invoked by devops-platform-ci-templates v3.x — names are contractual)
# ---------------------------------------------------------------------------

[tasks.ruff]
description = "ruff lint (pass --fix to auto-fix and format)"
usage = 'flag "--fix" help="Auto-fix lint issues and run ruff format"'
run = '''
if [ "${usage_fix:-false}" = "true" ]; then
  ruff check --fix .
  ruff format .
else
  ruff check .
fi
'''

[tasks."snyk-code"]
description = "snyk code scan (CI)"
run = "snyk . test"

[tasks.hadolint]
description = "hadolint Dockerfile lint (CI)"
run = 'hadolint $(find . -name "Dockerfile")'

[tasks.gitleaks]
description = "gitleaks secret scan (CI)"
run = "gitleaks detect --source . --verbose"

[tasks."poetry-lock-check"]
description = "Verify datalake_sdk/poetry.lock is in sync with pyproject.toml (fast, no dep resolution — used by CI + pre-commit)"
run = "poetry check --lock --directory datalake_sdk"

[tasks.trivy]
description = "trivy IaC misconfig scan. Default: show all severities, exit 0 (informative). --strict: fail on HIGH/CRITICAL only (used by CI + pre-commit)."
usage = 'flag "--strict" help="Fail (exit 1) on HIGH/CRITICAL findings, hide LOW/MEDIUM"'
run = '''
if [ "${usage_strict:-false}" = "true" ]; then
  trivy config --severity HIGH,CRITICAL --exit-code 1 --misconfig-scanners terraform --skip-dirs cookiecutter_template --skip-dirs _integration_test .
else
  trivy config --misconfig-scanners terraform --skip-dirs cookiecutter_template --skip-dirs _integration_test .
fi
'''

# ---------------------------------------------------------------------------
# Local-only convenience
# ---------------------------------------------------------------------------

[tasks.pre-commit-install]
description = "Install the .pre-commit-config.yaml hooks into .git/hooks/"
run = "pre-commit install"
